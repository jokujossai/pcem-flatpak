name: Build Flatpak

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ID: io.github.jokujossai.pcem

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GPG
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_GREP: ${{ vars.GPG_KEY_GREP }}
        run: |
          mkdir -p ~/.gnupg
          echo "allow-preset-passphrase" >> ~/.gnupg/gpg-agent.conf
          gpg-connect-agent reloadagent /bye
          echo "${GPG_PASSPHRASE}" | /usr/libexec/gpg-preset-passphrase --preset "${GPG_KEY_GREP}"
          echo "${GPG_PRIVATE_KEY}" | gpg --import --batch

      - name: Restore repository
        if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GPG_KEY_ID: ${{ vars.GPG_KEY_ID }}
        run: |
          set -e
          BASE_URL="$(gh api /repos/${GITHUB_REPOSITORY}/pages --jq .html_url)" || true
          if [ -z "$BASE_URL" ]; then
            echo "Pages not configured yet"
            exit 0
          fi

          curl -o/dev/null -sf "${BASE_URL}summary" || {
            echo "Repository does not exist yet"
            exit 0
          }

          ostree --repo=repo init --mode=archive
          ostree --repo=repo remote add pcem-flatpak "${BASE_URL%/}" --gpg-import=repo.gpg
          ostree --repo=repo pull --mirror pcem-flatpak --depth=-1 || true

          flatpak build-update-repo \
            --gpg-sign="${GPG_KEY_ID}" \
            --generate-static-deltas \
            --prune \
            repo || true

          curl -o repo/config -sf "${BASE_URL}config" || true
          rm -rf repo/*.trustedkeys.gpg repo/extensions repo/state repo/tmp 2>/dev/null || true

      - name: Install LLVM SDK Extension
        run: |
          flatpak install -y --noninteractive flathub org.freedesktop.Sdk.Extension.llvm20//25.08

      - name: Build PCem
        id: build-pcem
        uses: flatpak/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: ${{ env.APP_ID }}.flatpak
          manifest-path: base/${{ env.APP_ID }}/${{ env.APP_ID }}.yml
          branch: '25.08'
          gpg-sign: ${{ vars.GPG_KEY_ID }}
          build-bundle: ${{ github.ref_type == 'tag' }}

      - name: Update repo
        env:
          GPG_KEY_ID: ${{ vars.GPG_KEY_ID }}
        run: |
          flatpak build-update-repo \
            --gpg-sign="${GPG_KEY_ID}" \
            --generate-static-deltas \
            --prune \
            repo

      - name: Initialize GitHub Pages
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -e
          REPO_URL="https://${GITHUB_REPOSITORY%/*}.github.io/${GITHUB_REPOSITORY#*/}"

          cp repo.gpg repo/

          cat <<EOF > repo/pcem-flatpak.flatpakrepo
          [Flatpak Repo]
          Title=PCem Flatpak
          Url=${REPO_URL}
          Homepage=https://github.com/${GITHUB_REPOSITORY}
          GPGKey=$(base64 -w0 repo.gpg)
          EOF

          cat <<EOF > repo/index.html
          <!DOCTYPE html>
          <html>
            <head>
              <title>PCem Flatpak Repository</title>
              <style>
                body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
                pre { background: #f5f5f5; padding: 1rem; overflow-x: auto; }
                code { background: #f5f5f5; padding: 0.2rem 0.4rem; }
              </style>
            </head>
            <body>
              <h1>PCem Flatpak</h1>
              <p>Flatpak repository for PCem, a PC emulator for classic IBM PC compatibles.</p>

              <h2>Installation</h2>
              <p>Add this repository:</p>
              <pre>flatpak remote-add --if-not-exists pcem-flatpak ${REPO_URL}/pcem-flatpak.flatpakrepo</pre>

              <p>Install PCem:</p>
              <pre>flatpak install pcem-flatpak ${APP_ID}</pre>

              <h2>Running</h2>
              <pre>flatpak run ${APP_ID}</pre>

              <h2>Source Code</h2>
              <p><a href="https://github.com/${GITHUB_REPOSITORY}">https://github.com/${GITHUB_REPOSITORY}</a></p>
            </body>
          </html>
          EOF

      - name: Upload repository as artifact
        if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-repo
          path: repo/
          retention-days: 30

      - name: Save pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo/

      - name: Publish check result
        uses: LouisBrunner/checks-action@v2.0.0
        if: always()
        with:
          token: ${{ github.token }}
          name: Build Result
          conclusion: ${{ steps.build-pcem.conclusion }}
          output: |
            {
              "summary": "Build completed",
              "text_description": "PCem: ${{ steps.build-pcem.conclusion }}"
            }

  deploy:
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download flatpak artifacts
        if: github.ref_type == 'tag'
        uses: actions/download-artifact@v4
        with:
          pattern: "*.flatpak"
          merge-multiple: true

      - name: Create release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: "*.flatpak"
          generate_release_notes: true

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
